name: Generate Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Doxygen and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-cyrillic

    - name: Run Doxygen
      run: doxygen Doxyfile

    - name: Compile LaTeX to PDF
      run: |
        cd docs/latex
        # 1. Remove existing conflicting packages
        sed -i '/\\usepackage\[.*\]{fontenc}/d' refman.tex
        sed -i '/\\usepackage{fontenc}/d' refman.tex
        sed -i '/\\usepackage\[.*\]{babel}/d' refman.tex
        sed -i '/\\usepackage{babel}/d' refman.tex
        
        # 2. Create the fix content
        echo "\\usepackage[T2A,T1]{fontenc}" > fix.tex
        echo "\\usepackage[utf8]{inputenc}" >> fix.tex
        echo "\\usepackage[bulgarian,english]{babel}" >> fix.tex
        
        # 3. Find the line number of \documentclass and insert after it
        # This is more reliable than assuming line 1
        LINE_NUM=$(grep -n "\\documentclass" refman.tex | head -n 1 | cut -d: -f1)
        sed -i "${LINE_NUM}r fix.tex" refman.tex

        make
        cp refman.pdf ../70mai_Dashcam_Transfer_Docs.pdf
        cd ../..

    - name: Clean up LaTeX intermediate files
      run: rm -rf docs/latex

    - name: Commit and Push Documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f docs/
        git commit -m "Update documentation [skip ci]" || echo "No changes to commit"
        git push
