name: Generate Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Doxygen, Graphviz and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz \
          texlive-latex-base texlive-latex-recommended texlive-latex-extra \
          texlive-fonts-recommended texlive-fonts-extra texlive-lang-cyrillic

    - name: Run Doxygen
      run: doxygen Doxyfile

    - name: Compile LaTeX to PDF
      run: |
        cd docs/latex
        # 1. Force the use of T2A (Cyrillic) and UTF-8
        # Doxygen often puts \usepackage[T1]{fontenc}. We swap it.
        sed -i 's/\\usepackage\[T1\]{fontenc}/\\usepackage[T2A,T1]{fontenc}/g' refman.tex
        
        # 2. Add bulgarian to babel options. Doxygen usually generates \usepackage[english]{babel}
        sed -i 's/\\usepackage\[english\]{babel}/\\usepackage[bulgarian,english]{babel}/g' refman.tex

        # 3. Create a small map to handle Cyrillic characters that might still cause issues
        # and ensure utf8 inputenc is loaded early.
        sed -i '/\\documentclass/a \\usepackage[utf8]{inputenc}' refman.tex

        # 4. Use 'make' but ignore errors on first pass if any, then run again to fix indices
        # pdflatex is more robust for Doxygen's default templates than xelatex
        make || make
        cp refman.pdf ../70mai_Dashcam_Transfer_Docs.pdf
        cd ../..

    - name: Clean up LaTeX intermediate files
      run: rm -rf docs/latex

    - name: Commit and Push Documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f docs/
        git commit -m "Update documentation [skip ci]" || echo "No changes to commit"
        git push
