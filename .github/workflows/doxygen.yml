name: Generate Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Doxygen, Graphviz and XeLaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz \
          texlive-xetex texlive-latex-extra texlive-fonts-recommended \
          texlive-lang-cyrillic fonts-freefont-ttf

    - name: Run Doxygen
      run: doxygen Doxyfile

    - name: Compile LaTeX to PDF using XeLaTeX
      run: |
        cd docs/latex
        # XeLaTeX handles Unicode natively. We need to tell Doxygen's Makefile to use it.
        # We also need to set a font that supports Cyrillic.
        sed -i 's/\\usepackage\[T1\]{fontenc}/\\usepackage{fontspec}/g' refman.tex
        sed -i 's/\\usepackage\[english\]{babel}/\\usepackage{polyglossia}\n\\setmainlanguage{english}\n\\setotherlanguage{bulgarian}\n\\newfontfamily\\cyrillicfont{FreeSerif}/g' refman.tex
        
        # Update Makefile to use xelatex
        sed -i 's/pdflatex/xelatex/g' Makefile

        make
        cp refman.pdf ../70mai_Dashcam_Transfer_Docs.pdf
        cd ../..

    - name: Clean up LaTeX intermediate files
      run: rm -rf docs/latex

    - name: Commit and Push Documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f docs/
        git commit -m "Update documentation [skip ci]" || echo "No changes to commit"
        git push
