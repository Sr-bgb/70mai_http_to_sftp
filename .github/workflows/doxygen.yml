name: Generate Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Doxygen and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-cyrillic

    - name: Run Doxygen
      run: doxygen Doxyfile

    - name: Compile LaTeX to PDF
      run: |
        cd docs/latex
        # Remove any existing fontenc or babel calls to avoid conflicts
        sed -i '/\\usepackage\[.*\]{fontenc}/d' refman.tex
        sed -i '/\\usepackage{fontenc}/d' refman.tex
        sed -i '/\\usepackage\[.*\]{babel}/d' refman.tex
        
        # Inject the correct packages at the very top of the preamble (after documentclass)
        sed -i '/\\documentclass/a \\usepackage[T2A,T1]{fontenc}\n\\usepackage[utf8]{inputenc}\n\\usepackage[bulgarian,english]{babel}' refman.tex

        make
        cp refman.pdf ../70mai_Dashcam_Transfer_Docs.pdf
        cd ../..

    - name: Clean up LaTeX intermediate files
      run: rm -rf docs/latex

    - name: Commit and Push Documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f docs/
        git commit -m "Update documentation [skip ci]" || echo "No changes to commit"
        git push
