name: Generate Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Doxygen and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-cyrillic

    - name: Run Doxygen
      run: doxygen Doxyfile

    - name: Compile LaTeX to PDF
      run: |
        cd docs/latex
        # 1. Add Cyrillic/Bulgarian support by modifying the refman.tex directly
        # We replace the standard packages with the ones supporting T2A and Bulgarian
        sed -i 's/\\usepackage\[T1\]{fontenc}/\\usepackage[T2A,T1]{fontenc}/g' refman.tex
        sed -i 's/\\usepackage\[english\]{babel}/\\usepackage[bulgarian,english]{babel}/g' refman.tex
        
        # 2. Add inputenc with utf8 support if not present, but do it safely inside the preamble
        # We find the line with \begin{document} and insert just before it
        # However, to be extra safe against "Missing \begin{document}", we avoid inserting at the end
        # and instead use the existing package replacements.

        make
        cp refman.pdf ../70mai_Dashcam_Transfer_Docs.pdf
        cd ../..

    - name: Clean up LaTeX intermediate files
      run: rm -rf docs/latex

    - name: Commit and Push Documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f docs/
        git commit -m "Update documentation [skip ci]" || echo "No changes to commit"
        git push
