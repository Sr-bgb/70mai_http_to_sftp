name: Generate Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Doxygen and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-cyrillic

    - name: Run Doxygen
      run: doxygen Doxyfile

    - name: Compile LaTeX to PDF
      run: |
        cd docs/latex
        # 1. Force the correct encodings at the very top of the file
        # We use a temp file to safely prepend lines to refman.tex
        echo "\\PassOptionsToPackage{T2A,T1}{fontenc}" > preamble.tmp
        echo "\\PassOptionsToPackage{bulgarian,english}{babel}" >> preamble.tmp
        cat refman.tex >> preamble.tmp
        mv preamble.tmp refman.tex
        
        # 2. Ensure UTF-8 is handled for Cyrillic
        sed -i 's/\\usepackage\[T1\]{fontenc}/\\usepackage[T2A,T1]{fontenc}/g' refman.tex
        sed -i 's/\\usepackage\[english\]{babel}/\\usepackage[bulgarian,english]{babel}/g' refman.tex
        
        # 3. Sometimes Doxygen misses the inputenc for the main file
        sed -i '/\\begin{document}/i \\usepackage[utf8]{inputenc}' refman.tex

        make
        cp refman.pdf ../70mai_Dashcam_Transfer_Docs.pdf
        cd ../..

    - name: Clean up LaTeX intermediate files
      run: rm -rf docs/latex

    - name: Commit and Push Documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f docs/
        git commit -m "Update documentation [skip ci]" || echo "No changes to commit"
        git push
